# ---------------------------------------------------------------------------
# jellyfin-gate + Jellyfin
#
# THE IMPORTANT LINE IN THIS FILE IS THE ONE THAT ISN'T HERE:
# the `jellyfin` service publishes NO ports.
#
# Jellyfin serves /Videos/{id}/stream with no authentication whatsoever — an
# item id is the only thing required to stream a file. Left on the default
# 0.0.0.0:8096 that means anyone who can reach the host can bypass this gateway
# entirely. With no port published it is reachable only from the gate container
# over the compose network, so the bypass is closed structurally rather than by
# configuration that can be forgotten.
#
# It still has outbound internet access, which it needs for TMDB metadata. That
# is fine: the bypass requires an INBOUND route, and there is none.
#
# Do not add a `ports:` mapping to the jellyfin service. If you need its
# dashboard, use `docker compose exec` or an SSH tunnel.
# ---------------------------------------------------------------------------

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped
    # This host is a 2-core/4-thread i3-6100 — Jellyfin's own software
    # transcode is the single biggest CPU consumer on the box, so it gets the
    # most headroom, but capped below the full logical count so the gate
    # always has room to breathe. cpu_shares is the relative-priority weight
    # under real contention (works without Swarm); the gate's is 4x this one.
    cpus: "2.5"
    mem_limit: 2g
    cpu_shares: 512
    networks:
      - internal
    volumes:
      - jellyfin-config:/config
      - jellyfin-cache:/cache
      # Read-only: the gateway disables deletion in the user policy, but the
      # container has no business writing to the library either way.
      - ${MEDIA_PATH:-./media}:/media:ro
    # Hardware transcoding lives in docker-compose.linux.yml, because /dev/dri
    # does not exist on a Windows host and naming a missing device stops the
    # container from starting at all. See that file, and the Windows notes in
    # the README.
    environment:
      - JELLYFIN_PublishedServerUrl=http://jellyfin:8096
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/System/Info/Public"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  gate:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit, and not optional. Docker builds the LAST stage when no target
      # is given, and the last stage in the Dockerfile is now `party` (it was
      # `worker` before that stage existed) — omitting this silently produces
      # a gateway image containing neither ffmpeg nor server.js, which starts
      # and does nothing useful. Every stage in this file sets target
      # explicitly for exactly this reason; don't add one that doesn't.
      target: runtime
      args:
        # NEXT_PUBLIC_PARTY_WS_PATH was removed 2026-08-28 along with the
        # WebSocket transport it configured. The watch party now uses SSE on
        # this same origin (src/lib/party-bus.ts), so there is no separate
        # realtime host to point anything at.
        {}
    container_name: jellyfin-gate
    restart: unless-stopped
    # Deliberately the lowest cpus ceiling of the three real services but the
    # highest cpu_shares (relative-priority weight) — this is the process a
    # real visitor is waiting on, so under CPU contention from a transcode it
    # should win scheduling even though its own ceiling is modest.
    cpus: "1.5"
    mem_limit: 512m
    cpu_shares: 2048
    depends_on:
      jellyfin:
        condition: service_healthy
    networks:
      - internal
      - edge
    ports:
      # GATE_BIND=0.0.0.0 for LAN testing; 127.0.0.1 in production, where the
      # tunnel reaches the gate over the compose network and nothing needs to
      # be exposed on the host at all.
      - "${GATE_BIND:-127.0.0.1}:3000:3000"
    environment:
      - ADMIN_API_KEY=${ADMIN_API_KEY:?set ADMIN_API_KEY in .env}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:?run scripts/bootstrap-jellyfin.mjs first}
      - PUBLIC_URL=${PUBLIC_URL:?set PUBLIC_URL in .env}
      # Service name, not localhost: Jellyfin is a separate container.
      - JELLYFIN_URL=http://jellyfin:8096
      - DATABASE_PATH=/app/data/jellyfin-gate.db
      - TRUST_CF_CONNECTING_IP=${TRUST_CF_CONNECTING_IP:-false}
      # Must be false for plain-http LAN testing, true behind Cloudflare.
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Optional. Without it the ratings row falls back to Jellyfin's own
      # TMDB score; with it, IMDb / Rotten Tomatoes / Metacritic appear.
      - OMDB_API_KEY=${OMDB_API_KEY:-}
      # Optional. Powers "fetch a missing subtitle from OpenSubtitles" (both
      # the consumer-facing item-page button and Library Review's action).
      - OPENSUBTITLES_API_KEY=${OPENSUBTITLES_API_KEY:-}
      # Optional. Powers Library Review's "Change poster" action and half of
      # parental control's content-warning backfill (content-warnings.ts).
      - TMDB_READ_ACCESS_TOKEN=${TMDB_READ_ACCESS_TOKEN:-}
      # Optional. The other half of parental control's content-warning
      # backfill — see the attribution note in curator.html's Users tab
      # before setting this on a deployment other people can see.
      - DDD_API_KEY=${DDD_API_KEY:-}
      - MEDIA_LIBRARY=/media
      - MEDIA_EXCLUDED=/excluded
      # The real Windows path behind /media, for building file:// links the
      # dashboard can open in Explorer. Container paths mean nothing on the
      # host side of that link.
      - HOST_MEDIA_PATH=${MEDIA_PATH:-./media}
      # Read side of the offline-download cache the worker writes into (see
      # the worker service below) — the gate's own download route serves
      # straight from here once a prepare job is done.
      - MEDIA_DOWNLOADS_CACHE=/downloads-cache
      # Where an uploaded-but-unreviewed film from a Langlois-mode user
      # lands. Read-write here (unlike jellyfin's mount) because the upload
      # route writes directly into it, and the approve/reject admin routes
      # move or delete from it.
      - MEDIA_QUARANTINE=/quarantine
      # Same watch-folder drop zone the worker service points MEDIA_INCOMING
      # at below. Only touched by the upload-approval route, which moves an
      # approved file here so the worker's existing pipeline picks it up —
      # this is the ONE thing the gate ever writes into MEDIA_INCOMING for.
      - MEDIA_INCOMING=/incoming
    volumes:
      - gate-data:/app/data
      # Read-write, unlike the jellyfin service's read-only mount: the library
      # review dashboard (/api/admin/library/*) needs to move files out of the
      # library (duplicates, excluded items) on the admin's say-so. Jellyfin
      # itself still can't touch media — this grants the gate the capability,
      # not Jellyfin.
      - ${MEDIA_PATH:-./media}:/media
      # A SEPARATE mount, deliberately not a subfolder of the line above.
      # Jellyfin scans its library root recursively, so an excluded-items
      # folder living inside it gets re-indexed as new items on the very next
      # scan — silently undoing the exclusion. This must be outside whatever
      # directory MEDIA_PATH points at.
      - ${MEDIA_EXCLUDED_PATH:-./media-excluded}:/excluded
      # Shared with the worker (below), which is the process that actually
      # writes into it. Read-write here too: a cached file can outlive its
      # job row (manual cleanup) and the gate needs to notice that and
      # re-queue, same failure-open reasoning as the download route itself.
      - ${MEDIA_DOWNLOADS_CACHE_PATH:-./media-downloads-cache}:/downloads-cache
      - ${MEDIA_QUARANTINE_PATH:-./media-quarantine}:/quarantine
      # Shared with the worker's own mount of the same host path below —
      # the ONE thing the gate writes here is an approved upload; the
      # worker is what actually watches/processes this folder otherwise.
      - ${MEDIA_INCOMING:-./media/incoming}:/incoming

  # Watch-folder ingest. Converts anything a browser cannot direct-play and
  # publishes it into the library Jellyfin actually reads.
  #
  # Note the two separate mounts: MEDIA_INCOMING is NOT part of the Jellyfin
  # library. Jellyfin indexes a converted file sitting beside its source as a
  # second movie with the same name rather than another version of it, so the
  # drop zone has to be somewhere Jellyfin never looks.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      # Separate target: it carries ffmpeg, which the gateway image does not
      # need and which costs ~141 MB.
      target: worker
    container_name: jellyfin-gate-worker
    restart: unless-stopped
    # In WORKER_MODE=queue the script drains what's queued and exits 0 (see the
    # WORKER_MODE note below). Left alone, `restart: unless-stopped` then
    # respawns the whole container immediately, forever — roughly 8,600
    # container starts a day on an idle box, and because Docker applies
    # exponential backoff to those restarts (observed: 9s, 14s, 28s, 54s,
    # capping at 60s) a job queued by the gate's Transform button could sit
    # unnoticed for up to a minute.
    #
    # Wrapping the same script in a shell loop keeps ONE container resident and
    # re-runs the drain on a fixed, predictable interval instead. Cheaper (no
    # per-cycle container/network/mount setup) and more responsive. The trap
    # forwards SIGTERM to the node child so `docker compose stop worker` still
    # shuts a conversion down cleanly rather than waiting out the timeout and
    # being SIGKILLed mid-transcode.
    #
    # This deliberately does NOT change what the worker acts on: still only
    # explicitly queued jobs, still no folder watching or library-wide scan.
    command:
      - sh
      - -c
      - |
        trap 'kill -TERM "$$child" 2>/dev/null; exit 0' TERM INT
        while true; do
          node /app/scripts/media-worker.mjs & child=$$!
          wait "$$child"
          sleep "$${WORKER_IDLE_SLEEP_SECONDS:-60}"
        done
    # Same weight class as jellyfin: it's the other software-encode process
    # on this box, and PAUSE_WHILE_STREAMING already keeps it from running
    # concurrently with active playback by design — this ceiling is a safety
    # net for the cases that doesn't cover (multiple simultaneous conversions).
    cpus: "1.5"
    mem_limit: 1g
    cpu_shares: 512
    depends_on:
      jellyfin:
        condition: service_healthy
    networks:
      - internal
    environment:
      - JELLYFIN_URL=http://jellyfin:8096
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:?run scripts/bootstrap-jellyfin.mjs first}
      - DATABASE_PATH=/app/data/jellyfin-gate.db
      - MEDIA_INCOMING=/incoming
      - MEDIA_LIBRARY=/media
      - WATCH_POLL_SECONDS=${WATCH_POLL_SECONDS:-30}
      # How long the queue-mode wrapper loop (see `command:` above) sleeps
      # between drains. Lower = a queued Transform job starts sooner; higher =
      # fewer wakeups on an idle box. Only meaningful in WORKER_MODE=queue.
      - WORKER_IDLE_SLEEP_SECONDS=${WORKER_IDLE_SLEEP_SECONDS:-60}
      # "queue" (default): drains only what the gate's Transform button
      # queued in media_jobs, then exits — no folder watching, no
      # library-wide auto-discovery. Set WORKER_MODE=watch to restore the
      # old always-on daemon behaviour below.
      - WORKER_MODE=${WORKER_MODE:-queue}
      # Continuously upgrade the existing library, not just new drops. Anything
      # a browser cannot direct-play gets converted in place; the original is
      # moved to MEDIA_ARCHIVE, which must sit OUTSIDE the library or Jellyfin
      # indexes both as separate movies. Only takes effect in WORKER_MODE=watch.
      - LIBRARY_SCAN=${LIBRARY_SCAN:-true}
      - LIBRARY_SCAN_INTERVAL_MINUTES=${LIBRARY_SCAN_INTERVAL_MINUTES:-60}
      - MEDIA_ARCHIVE=/incoming/.processed
      # Conversions and live transcodes fight for the same cores, so the worker
      # stands down whenever Jellyfin reports something playing.
      - PAUSE_WHILE_STREAMING=${PAUSE_WHILE_STREAMING:-true}
      # x264 preset for the software fallback. `veryfast` is ~3-4x quicker
      # than `slow` for a modest size increase — the right trade when the
      # alternative is a queue that takes all day.
      - TRANSCODE_PRESET=${TRANSCODE_PRESET:-veryfast}
      # Where processDownloadJob() writes prepared offline-download files —
      # this is the process that actually produces them; the gate only reads
      # what lands here (see the gate service's own mount above).
      - MEDIA_DOWNLOADS_CACHE=/downloads-cache
    volumes:
      # Same database file as the gate. Safe because it is in WAL mode — the
      # worker's progress writes do not block the gateway's page renders.
      - gate-data:/app/data
      - ${MEDIA_INCOMING:-./media/incoming}:/incoming
      # Writable here, unlike the read-only mount on the jellyfin service: this
      # is the process that publishes new files into the library.
      - ${MEDIA_PATH:-./media}:/media
      - ${MEDIA_DOWNLOADS_CACHE_PATH:-./media-downloads-cache}:/downloads-cache
    # GPU access is in docker-compose.linux.yml. Without it the worker encodes
    # in software — correct, just slower.

  # Watch-party realtime service — chat + playback sync over WebSocket. See
  # DESIGN-watch-party.md and scripts/party-server.mts's own header comment.
  #
  # NOT started by a plain `docker compose up -d` yet: it has no `ports:`
  # entry and nothing routes to it at the edge, so bringing it up alone does
  # nothing reachable — that routing (a cloudflared ingress rule, or the
  # native-Windows-tunnel equivalent this project actually runs in
  # production; see the jellyfin-gate-tunnel-architecture-drift note) still
  # needs to be wired up and smoke-tested before this is real. Until then,
  # start it explicitly and by itself for local testing:
  #
  #   docker compose up -d --build party
  # RETIRED 2026-08-28. Do not start this service.
  #
  # Watch-party realtime moved into the gate process and off WebSockets — see
  # src/lib/party-bus.ts. The short version: this service spoke WebSocket over
  # `/ws/party`, a path that was never routed, because production fronts the
  # app with a remotely managed Cloudflare tunnel whose ingress rules live in
  # the Cloudflare dashboard rather than in any file here. Every watch party
  # was therefore inert. SSE over the gate's own :3000 needs no edge change.
  #
  # Running this alongside the new implementation would be ACTIVELY HARMFUL,
  # not merely redundant: its empty-room sweep counts *its own* WebSocket
  # connections, would see zero for every room now that clients connect to the
  # gate instead, and would auto-end every live party after fifteen minutes.
  #
  # Kept in the file (rather than deleted) so the reasoning survives, and
  # renamed so `docker compose up` cannot start it by accident. scripts/
  # party-server.mts is likewise kept but no longer runs.
  party-retired:
    profiles: ["retired"]
    build:
      context: .
      dockerfile: Dockerfile
      target: party
    container_name: jellyfin-gate-party
    restart: "no"
    cpus: "0.5"
    mem_limit: 256m
    networks:
      - edge
    environment:
      - DATABASE_PATH=/app/data/jellyfin-gate.db
      - PARTY_PORT=${PARTY_PORT:-4001}
    volumes:
      # Same database file as the gate and the worker — safe under WAL, same
      # reasoning as the worker service's own comment on this line.
      - gate-data:/app/data

  # Cloudflare tunnel. Outbound-only, so there is no port to forward and no
  # inbound firewall rule to get wrong.
  #
  # It reaches the gateway at http://gate:3000 over the compose network rather
  # than via the host, which is why the gate does not need to publish a port in
  # production. Starts with everything else: `docker compose up -d`.
  #
  # This used to sit behind a `tunnel` profile so that LAN-only testing could
  # not put the library on the internet by accident. That turned out to cost
  # more than it protected: a service in an inactive profile is invisible to
  # compose, not merely skipped, so every routine `docker compose up -d` left
  # the site dark with no error to explain why. The tunnel is now always part
  # of the stack. To bring the stack up without it:
  #
  #   docker compose up -d --scale tunnel=0
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jellyfin-gate-tunnel
    restart: unless-stopped
    # A lightweight outbound-only proxy — no real CPU need, capped mainly so
    # a runaway reconnect loop can't become a resource problem of its own.
    cpus: "0.25"
    mem_limit: 128m
    depends_on:
      - gate
    networks:
      - edge
    # The image ENTRYPOINT is already `cloudflared --no-autoupdate`, so this
    # appends to it. No --config flag is needed because the mount below lands
    # in one of cloudflared's default search paths.
    # Runs as the owner of ~/.cloudflared rather than the image default
    # (uid 65532). Those credentials are 0600 inside a 0700 directory —
    # correct for secrets — so the default user cannot even traverse the
    # directory, and cloudflared then starts up believing it has no config
    # and complains that the tunnel ID is missing.
    # On Linux this must be the owner of ~/.cloudflared: the credentials are
    # 0600 inside a 0700 directory, so the image's default uid 65532 cannot
    # even traverse it, and cloudflared then starts up believing it has no
    # config and complains the tunnel ID is missing.
    #
    # On Windows there are no such permissions to satisfy — Docker Desktop
    # presents bind-mounted host directories as world-readable — so set
    # CF_USER=0:0 there and stop thinking about it.
    user: "${CF_USER:-${CF_UID:-1000}:${CF_GID:-1000}}"
    # --protocol http2 forces the TCP transport. cloudflared prefers QUIC,
    # which needs outbound UDP/7844 — blocked on plenty of consumer ISPs,
    # including this one: TCP 7844 connects fine while every QUIC handshake
    # times out. Set CF_PROTOCOL=quic to use QUIC where UDP is allowed; it
    # is the better transport when it works.
    # --edge-ip-version 4 because this network has no working IPv6 route to
    # the edge; without it cloudflared burns retries on AAAA records that
    # always time out.
    # CF_EXTRA_ARGS is a passthrough for extra cloudflared flags. Normally empty.
    #
    # NOT the place to pin --edge: cloudflared's startup precheck resolves the
    # whole --edge value as a hostname, so both "a:7844,b:7844" and repeated
    # --edge flags hard-fail with "failed to resolve any edge address" and the
    # process exits before connecting. Verified against 2026.7.3.
    #
    # This network reaches only one of Cloudflare's two edge regions at a time,
    # and WHICH ONE FLIPS. Measured an hour apart: region1 0/10 reachable and
    # region2 10/10, then the exact inverse. So a pinned address list would work
    # until it silently did not. Leaving discovery to cloudflared costs a slower
    # reconnect while it times out the unreachable half, and is the only thing
    # that survives the flip.
    command: >
      tunnel --loglevel info
      --protocol ${CF_PROTOCOL:-http2}
      --edge-ip-version ${CF_EDGE_IP_VERSION:-4}
      ${CF_EXTRA_ARGS:-}
      run
    volumes:
      # Mounted at /etc/cloudflared, NOT ~/.cloudflared. The image sets no HOME
      # environment variable, so cloudflared cannot expand "~" and silently
      # fails to find its config — it then complains that the tunnel ID is
      # missing. /etc/cloudflared is in its default search path regardless.
      #
      # Read-only: this container has no business rewriting your credentials.
      #
      # CF_CREDS_DIR exists for Windows, where ${HOME} is not set at all and
      # the path looks like C:/Users/<name>/.cloudflared (forward slashes;
      # compose does not want the backslashes Explorer shows you).
      - ${CF_CREDS_DIR:-${HOME}/.cloudflared}:/etc/cloudflared:ro

networks:
  # Carries gate <-> jellyfin traffic.
  #
  # Deliberately NOT `internal: true`. That flag blocks outbound traffic as well
  # as inbound, and Jellyfin needs egress to fetch metadata and artwork from
  # TMDB — with it set, every title stays stuck on its raw filename forever and
  # no poster ever loads.
  #
  # The isolation that actually matters comes from the `jellyfin` service
  # publishing no ports: nothing outside this host can reach it, which is what
  # closes the unauthenticated-stream bypass. Outbound-only is exactly the
  # posture wanted here.
  internal:
  # Only the gate is attached to this, and only the gate publishes a port.
  edge:

volumes:
  jellyfin-config:
  jellyfin-cache:
  gate-data:
