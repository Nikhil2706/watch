# Builds the sideloadable Watch APK on GitHub's runners.
#
# Why here and not on the server: the toolchain is a JDK plus ~2.5GB of
# Android SDK, and downloading it on the host is what took the WSL distro's
# filesystem down on 2026-09-06 - every binary started returning EIO and the
# site served 502 until the VM was recycled. That machine's boot SSD is
# failing (see PROJECT_KNOWLEDGE.md), so the build lives somewhere with a
# disk we don't care about. apps/mobile/build-apk.sh still does the same
# thing locally if you ever want it.
#
# Grab the APK from the run's Artifacts section. It is debug-signed, which
# is what makes it installable by sideload - see apps/mobile/README.md for
# what that means for updates.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      dev_server_url:
        description: >-
          Build a DEV apk pointing at this dev server instead of the live site,
          e.g. http://192.168.1.20:3000. Leave empty for a normal release build.
          A dev build installs beside the real app (id .dev), is debug-signed,
          and never publishes a release.
        required: false
        default: ""
  push:
    branches: [platform-additions]
    paths:
      - "apps/mobile/**"
      - "brand/**"
      - ".github/workflows/android-apk.yml"

# contents: write so the build can publish the release the app updates itself
# from (see apps/mobile UpdateChecker).
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 8.7.2 (android/build.gradle) supports 17-21.
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Match android/variables.gradle rather than trusting whatever the
      # runner image happens to ship this month.
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Icons and splash from brand/
        working-directory: apps/mobile
        env:
          BRAND_DIR: ${{ github.workspace }}/brand
          OUT_DIR: ${{ github.workspace }}/apps/mobile/assets
        run: |
          npm ci
          npm install --no-save sharp @capacitor/assets
          node make-assets.js
          npx --yes @capacitor/assets generate --android \
            --iconBackgroundColor '#06070a' \
            --iconBackgroundColorDark '#06070a' \
            --splashBackgroundColor '#06070a' \
            --splashBackgroundColorDark '#06070a'
          npx cap sync android

      # Rewritten AFTER cap sync so it lands in the packaged assets, and only
      # ever for a manually-triggered dev build. cleartext is required because
      # a dev server on a LAN is plain http, and Android blocks that by default.
      - name: Point this build at the dev server
        if: inputs.dev_server_url != ''
        working-directory: apps/mobile
        env:
          DEV_URL: ${{ inputs.dev_server_url }}
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/assets/capacitor.config.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.server = { url: process.env.DEV_URL, cleartext: true, androidScheme: "http" };
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log("dev build will load", c.server.url);
          '


      - name: Confirm the APK will point at the live site
        if: inputs.dev_server_url == ''
        working-directory: apps/mobile
        run: |
          url=$(node -p "require('./android/app/src/main/assets/capacitor.config.json').server.url")
          echo "server.url = $url"
          # The canonical host moved off watch2. on 2026-09-05; an APK built
          # against the old one is the kind of thing you only notice on
          # someone else's phone.
          test "$url" = "https://watch.abhigyanverma.com"

      # The dev path stops here: a debug-signed APK with a different
      # application id, uploaded as a workflow artifact and never published as
      # a release. It cannot update, or be mistaken for, the real app.
      - name: assembleDebug (dev build)
        if: inputs.dev_server_url != ''
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: What did we build (dev)
        if: inputs.dev_server_url != ''
        working-directory: apps/mobile
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          ls -la "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "^package"
          echo "points at: ${{ inputs.dev_server_url }}"

      - uses: actions/upload-artifact@v4
        if: inputs.dev_server_url != ''
        with:
          name: watch-dev-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # Written outside the workspace so it can never be picked up by a build
      # step or, worse, committed. Runners are destroyed after the job.
      - name: Materialise the signing keystore
        if: inputs.dev_server_url == ''
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set - the APK would be" \
                 "signed with a throwaway debug key and could not update an" \
                 "installed app. Refusing to build."
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/watch-release.jks"
          test -s "$RUNNER_TEMP/watch-release.jks"

      - name: assembleRelease
        if: inputs.dev_server_url == ''
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/watch-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: What did we build
        if: inputs.dev_server_url == ''
        working-directory: apps/mobile
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" \
            | grep -E "^package|^application-label:|^launchable-activity|sdkVersion|targetSdkVersion"
          # Prove it is signed by the real key and not a debug one. apksigner
          # prints the certificate; a debug cert is CN=Android Debug.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
            | grep -E "Signer #1 certificate (DN|SHA-256)"
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" \
               | grep -q "CN=Android Debug"; then
            echo "::error::APK is debug-signed - it will not update installed copies."
            exit 1
          fi

      - name: Clean up the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/watch-release.jks"

      - uses: actions/upload-artifact@v4
        if: inputs.dev_server_url == ''
        with:
          name: watch-release-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # What the installed app checks against. GitHub keeps
      # /releases/latest/download/<asset> pointing at the newest release, so the
      # app needs no API call, no token and no rate limit - just two fixed URLs.
      - name: Publish the release the app updates from
        if: github.ref == 'refs/heads/platform-additions' && inputs.dev_server_url == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/mobile
          code=$(grep -oP 'versionCode\s+\K[0-9]+' android/app/build.gradle)
          name=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "publishing versionCode=$code versionName=$name"

          cp android/app/build/outputs/apk/release/app-release.apk \
             "$RUNNER_TEMP/watch-release.apk"
          cat > "$RUNNER_TEMP/latest.json" <<JSON
          {
            "versionCode": $code,
            "versionName": "$name",
            "apk": "https://github.com/${{ github.repository }}/releases/latest/download/watch-release.apk"
          }
          JSON

          tag="app-v$name"
          # Re-runnable: replace the release for this version rather than failing.
          gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Watch $name" \
            --notes "Sideload build. Installs over any earlier v1.2+ copy; older debug-signed installs must be removed first." \
            "$RUNNER_TEMP/watch-release.apk" \
            "$RUNNER_TEMP/latest.json"

      - name: Confirm the update descriptor is reachable
        if: github.ref == 'refs/heads/platform-additions' && inputs.dev_server_url == ''
        run: |
          url="https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
          for i in 1 2 3 4 5; do
            body=$(curl -fsSL "$url" 2>/dev/null) && break
            sleep 5
          done
          echo "$body"
          # The app is useless if this 404s, so fail the build rather than ship
          # an update path nobody can reach.
          echo "$body" | grep -q '"versionCode"'
