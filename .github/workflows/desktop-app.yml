# Builds the Windows desktop app (Tauri shell around the deployed site).
#
# On a Windows runner because that is where a Windows installer has to be
# built - Tauri links against WebView2 and packages with WiX/NSIS, neither of
# which cross-compiles from Linux. The host machine has no Rust toolchain at
# all and is not getting one: its boot drive is failing, and a large toolchain
# download already took the WSL filesystem down once (see apps/mobile/README).
#
# Artifacts: an NSIS setup .exe and an .msi. Neither is code-signed - see
# apps/desktop/README.md for what that means for whoever installs it.
name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [platform-additions]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      # A cold Rust build of Tauri is several minutes of compiling; this makes
      # every run after the first one cheap.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Confirm the app will point at the live site
        shell: bash
        working-directory: apps/desktop
        run: |
          url=$(node -p "require('./src-tauri/tauri.conf.json').app.windows[0].url")
          echo "window url = $url"
          # The canonical host moved off watch2. on 2026-09-05, and the desktop
          # scaffold was still on the old one. Same guard as the Android build.
          test "$url" = "https://watch.abhigyanverma.com"

      - name: Build
        working-directory: apps/desktop
        run: |
          npm ci
          # npm run, not npx: this pins the build to the @tauri-apps/cli in
          # package-lock.json rather than whatever npx decides to fetch.
          npm run tauri -- build

      - name: What did we build
        shell: bash
        working-directory: apps/desktop/src-tauri/target/release/bundle
        run: |
          find . -type f \( -name '*.exe' -o -name '*.msi' \) -print0 \
            | xargs -0 ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: watch-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
