# The gate every change passes before it can go live: typecheck, tests, and
# both Docker images building. Runs on every PR to platform-additions (and on
# platform-additions itself, so a red base is visible). The job is named
# "check" so branch protection can require it: Settings > Branches >
# platform-additions > Require status checks > "check".
name: Check

on:
  pull_request:
    branches: [platform-additions]
  push:
    branches: [platform-additions]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR makes the older run pointless.
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node:sqlite and --experimental-strip-types need 22, same as the images.
          node-version: "22"
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # The images the Mac actually runs. A broken Dockerfile (a package that
      # no longer exists, a COPY of a moved file) fails here, not at deploy.
      # Layers are cached in GitHub's cache, one scope per target, so an
      # unchanged dependency layer (npm ci, apk add ffmpeg/clamav) is reused.
      - uses: docker/setup-buildx-action@v3

      - name: Build the gate image (runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Build the worker image (worker)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
