[package]
name = "watch-desktop"
# The version the installer and the About box show comes from
# tauri.conf.json, not from here; keep them in step anyway so a `cargo`
# invocation does not report something different.
version = "1.0.0"
description = "Desktop shell for the Watch film library"
authors = ["abhigyanverma"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "watch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Offline downloads (src/offline.rs).
#
# reqwest carries default features on purpose: on Windows that means the
# platform TLS stack (schannel), so this builds on a plain windows-latest
# runner with no OpenSSL to install. "stream" is what allows writing a
# multi-gigabyte film to disk as it arrives instead of buffering it in memory.
reqwest = { version = "0.12", features = ["stream"] }
# StreamExt, for consuming reqwest's bytes_stream().
futures-util = "0.3"
# Resolving site-relative manifest URLs, and parsing them for the cookie
# lookup. Tauri already depends on this; declared so it is not an accident.
url = "2"

